<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>3Dash</title>
    <meta name="description"
        content="Play 3Dash online and survive intense 3D rhythm gameplay with spikes, portals, wave sections, custom levels, and fast reaction challenges.">
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background-image: linear-gradient(rgb(0, 0, 0), rgb(0, 102, 255));
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        canvas+* {
            z-index: 2;
        }

        .container {
            display: flex;
            background-color: #5d6b84;
            color: #fff;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        .posImg {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .logo {
            position: absolute;
            display: block;
            max-width: 100vw;
            max-height: 70vh;
            top: 300px;
        }

        .pos_progress {
            position: absolute;
            bottom: 15%;
            width: 100%;
        }

        .progress {
            margin: 1.5em auto;
            max-width: 436px;
            height: auto;
            display: none;
            position: relative;
        }

        .full {
            width: 97%;
            transform-origin: top left;
        }

        .box_process {
            width: 100%;
        }

        .process {
            width: 98%;
        }

        .progress .posfull,
        .progress .posbox {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress .posfull {
            top: 8px;
            z-index: 1;
        }

        .progress .posbox {
            top: 0;
            z-index: 2;
        }

        #loader {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgb(0, 0, 0), rgb(0, 102, 255));
        }

        .pos_spinner {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-30%, -50%);
        }

        .spinner,
        .spinner:after {
            display: none;
            border-radius: 50%;
            width: 5em;
            height: 5em;
        }

        .spinner {
            margin: 10px;
            font-size: 10px;
            position: relative;
            text-indent: -9999em;
            border-top: 1.1em solid rgba(255, 255, 255, 0.2);
            border-right: 1.1em solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
            border-left: 1.1em solid #ffffff;
            transform: translateZ(0);
            animation: spinner-spin 1.1s infinite linear;
        }

        @keyframes  spinner-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    
    <link rel="stylesheet" href="3dash/css/gameloader2020.css" />
    <script src="3dash/js/gameloader2020.js"></script>
    <script src="3dash/js/v2.js"></script>
    <script>
        YaGames
            .init()
            .then(ysdk => {
                console.log('Yandex SDK initialized');
                window.ysdk = ysdk;
            });
        function Start() {
            var data = window.ysdk.deviceInfo;
            myGameInstance.SendMessage('YANDEX', 'GettingDevice', JSON.stringify(data));

        }
    </script>
    <div id="gameContainer"></div>

    <script type="text/javascript">
        var options = {
            author: "Vseigru",
            logo: "3dash/logo.jpg",
            gameName: "3Dash",
            gameNameEu: "3Dash",
            gameUrl: "42927",
            moreLink: (""),
            allowFullscreen: true,
            locale: "ru_RU",
            loader: "unity2020",
            loaderOptions: {
                unityLoaderUrl: "3dash/Build/3DDash.loader.js",
                unityConfigOptions: {
                    dataUrl: "3dash/Build/3DDash.data.unityweb",
                    frameworkUrl: "3dash/Build/3DDash.framework.js.unityweb",
                    codeUrl: "3dash/Build/3DDash.wasm.unityweb",
                    streamingAssetsUrl: "https://corsproxy.io/?https://geodash.org/game/StreamingAssets"
                }
            },
        };
        GameInit.load(options);	  
    </script>
</body>

</html>
